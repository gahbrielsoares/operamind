<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Operamind — Espólios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#05050f;--surface:#0d0d1f;--border:#1a1a35;
      --pink:#ff2d78;--violet:#9b30ff;--cyan:#00e5ff;--orange:#ff7a1a;--gold:#ffd700;
      --green:#00ff9d;--red:#ff4466;
      --text:#f0eeff;--muted:#8a80b0;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{min-height:100%;}
    body{overflow-x:clip;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;}
    button{font-family:inherit;color:inherit;}
    :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

    .bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;
      background:
        radial-gradient(ellipse 70% 50% at 0% 80%,rgba(255,45,120,.10) 0%,transparent 60%),
        radial-gradient(ellipse 50% 70% at 100% 10%,rgba(155,48,255,.12) 0%,transparent 60%);}
    .bg-canvas::after{content:'';position:absolute;inset:0;
      background-image:linear-gradient(rgba(155,48,255,.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(155,48,255,.04) 1px,transparent 1px);
      background-size:60px 60px;}

    /* ── NAV (mesmo padrão da Arena) ── */
    nav{display:flex;align-items:center;justify-content:space-between;gap:8px;
      padding:0 16px;height:56px;background:rgba(5,5,15,.85);
      border-bottom:1px solid var(--border);backdrop-filter:blur(16px);
      position:sticky;top:0;z-index:100;}
    .nav-logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.08em;text-decoration:none;
      background:linear-gradient(135deg,#c8b8ff,#9b30ff);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .nav-right{display:flex;align-items:center;gap:10px;}
    .blooms-badge{display:flex;align-items:center;gap:5px;
      background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.25);
      border-radius:20px;padding:5px 10px;
      font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.05em;color:var(--gold);}
    .blooms-label{font-size:10px;opacity:.6;font-family:'DM Sans',sans-serif;letter-spacing:.05em;}
    #blooms-count{display:inline-block;transition:transform .2s;}
    .nav-btn{display:flex;align-items:center;gap:5px;text-decoration:none;
      background:rgba(155,48,255,.08);border:1px solid rgba(155,48,255,.3);
      border-radius:20px;padding:5px 12px;color:#c8b8ff;
      font-family:'Bebas Neue',sans-serif;font-size:16px;letter-spacing:.05em;transition:all .2s;}
    .nav-btn:hover{border-color:var(--violet);color:#fff;box-shadow:0 0 14px rgba(155,48,255,.3);}

    /* ── Layout ── */
    .wrap{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:24px 20px 60px;}
    .page-head{margin-bottom:20px;}
    .page-title{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:.05em;line-height:1;
      background:linear-gradient(135deg,#fff,#c8b8ff,#9b30ff);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .page-sub{color:var(--muted);font-size:14px;margin-top:6px;max-width:60ch;line-height:1.6;}

    .editor-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start;}

    /* ── Palco do personagem ── */
    .stage{position:sticky;top:76px;border:1px solid var(--border);border-radius:20px;overflow:hidden;
      background:
        radial-gradient(ellipse 60% 45% at 50% 42%,rgba(155,48,255,.28),transparent 70%),
        linear-gradient(180deg,#0d0d1f 0%,#070714 100%);}
    .stage-figure{position:relative;height:400px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px;}
    .stage-figure::before{content:'';position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
      width:190px;height:34px;border-radius:50%;
      background:radial-gradient(ellipse at center,rgba(0,229,255,.35),rgba(155,48,255,.15) 55%,transparent 72%);
      box-shadow:0 0 0 1px rgba(0,229,255,.25),0 0 30px rgba(0,229,255,.2);}
    .stage-figure svg{position:relative;height:100%;width:auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5));}
    .stage-figure.pop svg{animation:pop .5s ease;}
    @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
    .preview-tag{position:absolute;top:12px;left:12px;font-size:11px;padding:4px 10px;border-radius:12px;
      background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.35);color:var(--cyan);display:none;}
    .preview-tag.on{display:block;}

    .buybar{border-top:1px solid var(--border);padding:14px 16px;min-height:78px;
      display:flex;flex-direction:column;justify-content:center;gap:10px;background:rgba(5,5,15,.6);}
    .buybar-hint{font-size:13px;color:var(--muted);line-height:1.5;}
    .buybar-item{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
    .buybar-name{font-weight:500;font-size:15px;}
    .buybar-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);letter-spacing:.04em;}
    .buybar-actions{display:flex;gap:8px;}
    .btn-buy{flex:1;padding:10px 14px;border:none;border-radius:10px;cursor:pointer;
      background:linear-gradient(135deg,#ffb800,#ff7a1a);color:#1a0d00;
      font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:.08em;
      box-shadow:0 4px 18px rgba(255,160,0,.3);transition:transform .15s,box-shadow .2s;}
    .btn-buy:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,160,0,.45);}
    .btn-buy:disabled{background:rgba(255,255,255,.06);color:var(--muted);box-shadow:none;cursor:not-allowed;
      font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:0;}
    .btn-ghost{padding:10px 14px;border-radius:10px;cursor:pointer;background:transparent;
      border:1px solid var(--border);color:var(--muted);font-size:13px;transition:all .2s;}
    .btn-ghost:hover{border-color:var(--muted);color:var(--text);}

    /* ── Painel de edição ── */
    .panel{border:1px solid var(--border);border-radius:20px;background:rgba(13,13,31,.85);overflow:hidden;}
    .tabs{display:flex;gap:4px;padding:10px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{flex-shrink:0;padding:8px 16px;border-radius:12px;border:1px solid transparent;background:transparent;
      color:var(--muted);font-size:14px;cursor:pointer;transition:all .2s;}
    .tab:hover{color:var(--text);}
    .tab[aria-selected="true"]{background:rgba(155,48,255,.14);border-color:rgba(155,48,255,.35);color:var(--text);font-weight:500;}
    .tab-body{padding:18px;}
    .cat{margin-bottom:22px;}
    .cat:last-child{margin-bottom:0;}
    .cat-title{font-size:13px;color:var(--muted);margin-bottom:10px;}

    .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;}
    .item{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
      padding:8px 6px 9px;border-radius:14px;cursor:pointer;
      background:rgba(255,255,255,.02);border:1px solid var(--border);transition:border-color .2s,background .2s;}
    .item:hover{border-color:rgba(155,48,255,.45);background:rgba(155,48,255,.05);}
    .item.equipped{border-color:var(--violet);background:rgba(155,48,255,.12);box-shadow:0 0 0 1px rgba(155,48,255,.4) inset;}
    .item.previewing{border-color:var(--cyan);background:rgba(0,229,255,.07);}
    .thumb{width:100%;aspect-ratio:1;border-radius:10px;background:#0a0a1a;display:flex;align-items:center;justify-content:center;overflow:hidden;}
    .thumb svg{width:100%;height:100%;}
    .thumb.none{color:var(--muted);font-size:24px;}
    .item-name{font-size:12px;text-align:center;line-height:1.25;min-height:2.5em;display:flex;align-items:center;}
    .price{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.04em;color:var(--gold);
      display:flex;align-items:center;gap:3px;}
    .price.free{color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0;}
    .price.owned{color:var(--green);font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0;}
    .lock{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
      background:rgba(5,5,15,.85);border:1px solid rgba(255,215,0,.35);display:flex;align-items:center;justify-content:center;}

    .swatches{display:flex;flex-wrap:wrap;gap:12px;}
    .swatch{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;
      background:none;border:none;cursor:pointer;padding:2px;min-width:52px;}
    .swatch-dot{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.12);
      transition:transform .15s,box-shadow .2s;}
    .swatch:hover .swatch-dot{transform:scale(1.08);}
    .swatch.equipped .swatch-dot{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--violet);}
    .swatch.previewing .swatch-dot{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--cyan);}
    .swatch .lock{top:-2px;right:2px;}
    .swatch-name{font-size:11px;color:var(--muted);}

    /* ── Troféus ── */
    .trophies{margin-top:36px;}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.05em;}
    .section-sub{color:var(--muted);font-size:14px;margin:4px 0 16px;line-height:1.6;}
    .section-sub strong{color:var(--text);font-weight:500;}
    .trophy-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;}
    .trophy{border:1px solid var(--border);border-radius:18px;padding:16px 12px 14px;text-align:center;
      background:rgba(13,13,31,.85);}
    .trophy.won{border-color:rgba(255,215,0,.3);
      background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(255,215,0,.08),transparent 70%),rgba(13,13,31,.85);}
    .trophy svg{width:78px;height:78px;}
    .trophy-name{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em;margin-top:4px;}
    .trophy-need{font-size:12px;color:var(--muted);margin-bottom:10px;}
    .t-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden;}
    .t-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--cyan));}
    .trophy.won .t-fill{background:linear-gradient(90deg,#ffb800,#ffe066);}
    .t-count{font-size:12px;margin-top:6px;color:var(--muted);}
    .trophy.won .t-count{color:var(--gold);}

    /* ── Toast ── */
    .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:900;
      padding:12px 18px;border-radius:12px;font-size:14px;pointer-events:none;
      background:#0d0d1f;border:1px solid rgba(0,255,157,.35);color:var(--green);
      box-shadow:0 10px 30px rgba(0,0,0,.5);transition:all .3s;}
    .toast.show{opacity:1;transform:translate(-50%,0);}

    @media (prefers-reduced-motion: reduce){
      *{animation:none!important;transition:none!important;}
    }

    /* ── Mobile ── */
    @media(max-width:860px){
      .editor-grid{display:block;}
      .panel{margin-top:14px;}
      .stage{top:60px;z-index:50;display:grid;grid-template-columns:130px 1fr;border-radius:16px;}
      .stage-figure{height:190px;padding-bottom:12px;}
      .stage-figure::before{width:110px;height:20px;bottom:8px;}
      .buybar{border-top:none;border-left:1px solid var(--border);padding:12px;}
      .buybar-actions{flex-direction:column;}
      .preview-tag.on{display:none;}
      .trophy-row{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
    }
    @media(max-width:768px){
      nav{padding:0 12px;height:52px;}
      .blooms-label{display:none;}
      .wrap{padding:16px 12px 48px;}
      .page-title{font-size:36px;}
      .items{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
    }
    @media(max-width:420px){
      .nav-logo{font-size:20px;}
      .blooms-badge,.nav-btn{padding:4px 9px;font-size:14px;}
    }
  </style>
</head>
<body>
<div class="bg-canvas"></div>

<nav>
  <a class="nav-logo" href="app.html">Operamind</a>
  <div class="nav-right">
    <div class="blooms-badge" id="blooms-badge" title="Seus blooms">
      <span>🪙</span><span id="blooms-count">0</span><span class="blooms-label">BLOOMS</span>
    </div>
    <a class="nav-btn" href="app.html">⚔️ Arena</a>
  </div>
</nav>

<div class="wrap">
  <header class="page-head">
    <h1 class="page-title">Espólios</h1>
    <p class="page-sub">Monte seu personagem com o que você conquistou. Toque em qualquer item para experimentar; os pagos você compra aqui mesmo com seus blooms.</p>
  </header>

  <div class="editor-grid">
    <aside class="stage" aria-label="Seu personagem">
      <div class="stage-figure" id="stage-figure">
        <span class="preview-tag" id="preview-tag">Experimentando</span>
      </div>
      <div class="buybar" id="buybar" aria-live="polite"></div>
    </aside>

    <section class="panel" aria-label="Personalização">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="tab-body" id="tab-body" role="tabpanel"></div>
    </section>
  </div>

  <section class="trophies" aria-labelledby="trophies-title">
    <h2 class="section-title" id="trophies-title">Troféus</h2>
    <p class="section-sub" id="trophies-sub"></p>
    <div class="trophy-row" id="trophy-row"></div>
  </section>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="db.js"></script>
<script src="espolios.js"></script>
<script>
  const E = Espolios;
  const sess = JSON.parse(localStorage.getItem('bloom_session') || 'null');
  if (!sess) window.location.href = 'index.html';
  const USER = sess?.username;

  let state = null;        // { blooms, avatar, owned }
  let preview = null;      // { cat, id } — item bloqueado sendo experimentado
  let activeTab = 'corpo';

  const LOCK_ICON = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="3"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  function load() {
    state = E.getState(USER);
    if (!state) { window.location.href = 'index.html'; return false; }
    return true;
  }

  function look() {
    return preview ? Object.assign({}, state.avatar, { [preview.cat]: preview.id }) : state.avatar;
  }

  // ── Render ──────────────────────────────────────────────────────────────
  function renderAll() {
    document.getElementById('blooms-count').textContent = state.blooms;
    renderStage();
    renderTabs();
    renderTabBody();
    renderTrophies();
  }

  function renderStage() {
    const fig = document.getElementById('stage-figure');
    fig.querySelector('svg')?.remove();
    fig.insertAdjacentHTML('beforeend', E.svg(look()));
    document.getElementById('preview-tag').classList.toggle('on', !!preview);

    const bar = document.getElementById('buybar');
    if (!preview) {
      bar.innerHTML = `<p class="buybar-hint">Itens com 🔒 custam blooms. Toque para experimentar antes de comprar.</p>`;
      return;
    }
    const it = E.getItem(preview.cat, preview.id);
    const missing = it.price - state.blooms;
    bar.innerHTML = `
      <div class="buybar-item">
        <span class="buybar-name">${it.name}</span>
        <span class="buybar-price">🪙 ${it.price}</span>
      </div>
      <div class="buybar-actions">
        <button class="btn-buy" id="btn-buy" ${missing > 0 ? 'disabled' : ''}>
          ${missing > 0 ? `Faltam ${missing} blooms` : `Comprar e usar`}
        </button>
        <button class="btn-ghost" id="btn-cancel">Desfazer</button>
      </div>`;
    document.getElementById('btn-cancel').onclick = () => { preview = null; renderStage(); renderTabBody(); };
    const buyBtn = document.getElementById('btn-buy');
    if (missing <= 0) buyBtn.onclick = doBuy;
  }

  function renderTabs() {
    document.getElementById('tabs').innerHTML = E.TABS.map(t =>
      `<button class="tab" role="tab" aria-selected="${t.id === activeTab}" data-tab="${t.id}">${t.label}</button>`
    ).join('');
    document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
      activeTab = b.dataset.tab; renderTabs(); renderTabBody();
    });
  }

  function priceHtml(cat, it) {
    if (it.price === 0) return `<span class="price free">Grátis</span>`;
    if (E.isOwned(state, cat, it.id)) return `<span class="price owned">✓ Seu</span>`;
    return `<span class="price">🪙 ${it.price}</span>`;
  }

  function renderTabBody() {
    const tab = E.TABS.find(t => t.id === activeTab);
    const body = document.getElementById('tab-body');
    body.innerHTML = tab.cats.map(cat => {
      const c = E.CATALOG[cat];
      const cells = c.items.map(it => {
        const equipped = state.avatar[cat] === it.id;
        const previewing = preview && preview.cat === cat && preview.id === it.id;
        const locked = !E.isOwned(state, cat, it.id);
        const cls = `${equipped ? ' equipped' : ''}${previewing ? ' previewing' : ''}`;
        const lock = locked ? `<span class="lock" aria-hidden="true">${LOCK_ICON}</span>` : '';
        const label = `${it.name}${it.price ? `, ${locked ? it.price + ' blooms' : 'desbloqueado'}` : ', grátis'}${equipped ? ', em uso' : ''}`;
        if (c.kind === 'color') {
          return `<button class="swatch${cls}" data-cat="${cat}" data-id="${it.id}" aria-label="${label}" aria-pressed="${equipped}">
              <span class="swatch-dot" style="background:${it.color}"></span>${lock}
              <span class="swatch-name">${it.name}</span>${priceHtml(cat, it)}
            </button>`;
        }
        let thumb;
        if (it.id === 'nenhum') thumb = `<span class="thumb none">∅</span>`;
        else {
          const a = Object.assign({}, state.avatar, { [cat]: it.id });
          if (cat === 'hair') a.hat = 'nenhum';
          if (cat === 'earrings') { a.hat = 'nenhum'; a.hair = 'careca'; }
          thumb = `<span class="thumb">${E.svg(a, { viewBox: E.thumbViewBox(cat, a) })}</span>`;
        }
        return `<button class="item${cls}" data-cat="${cat}" data-id="${it.id}" aria-label="${label}" aria-pressed="${equipped}">
            ${thumb}${lock}<span class="item-name">${it.name}</span>${priceHtml(cat, it)}
          </button>`;
      }).join('');
      return `<div class="cat"><h3 class="cat-title">${c.label}</h3>
        <div class="${c.kind === 'color' ? 'swatches' : 'items'}">${cells}</div></div>`;
    }).join('');
    body.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => select(b.dataset.cat, b.dataset.id));
  }

  function renderTrophies() {
    const n = E.countCorrectAt(USER);
    document.getElementById('trophies-sub').innerHTML =
      `Conquistados por acertos no nível <strong>${E.TROPHY_LEVEL}</strong>. Você tem <strong>${n}</strong> ${n === 1 ? 'acerto' : 'acertos'} nesse nível.`;
    document.getElementById('trophy-row').innerHTML = E.TROPHIES.map(t => {
      const won = n >= t.need;
      const pct = Math.min(100, Math.round(n / t.need * 100));
      return `<div class="trophy${won ? ' won' : ''}">
          ${E.trophySvg(t, won)}
          <div class="trophy-name">${t.name}</div>
          <div class="trophy-need">${t.need} acertos</div>
          <div class="t-bar"><div class="t-fill" style="width:${pct}%"></div></div>
          <div class="t-count">${won ? 'Conquistado' : `${Math.min(n, t.need)} / ${t.need}`}</div>
        </div>`;
    }).join('');
  }

  // ── Ações ───────────────────────────────────────────────────────────────
  function select(cat, id) {
    if (E.isOwned(state, cat, id)) {
      try { E.equip(USER, cat, id); } catch (e) { console.error(e); }
      preview = null;
      load();
    } else {
      preview = { cat, id };
    }
    renderStage();
    renderTabBody();
  }

  function doBuy() {
    if (!preview) return;
    const it = E.getItem(preview.cat, preview.id);
    const res = E.buy(USER, preview.cat, preview.id);
    if (!res.ok) { toast(res.reason, true); load(); renderAll(); return; }
    preview = null;
    load();
    renderAll();
    const fig = document.getElementById('stage-figure');
    fig.classList.remove('pop'); void fig.offsetWidth; fig.classList.add('pop');
    const cnt = document.getElementById('blooms-count');
    cnt.style.transform = 'scale(1.3)'; setTimeout(() => cnt.style.transform = 'scale(1)', 200);
    toast(`${it.name} desbloqueado.`);
  }

  let toastT;
  function toast(msg, isErr) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.color = isErr ? 'var(--red)' : 'var(--green)';
    el.style.borderColor = isErr ? 'rgba(255,68,102,.4)' : 'rgba(0,255,157,.35)';
    el.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // Recarrega ao voltar para a página (ex.: ganhou blooms na Arena em outra aba)
  window.addEventListener('pageshow', () => { if (USER && load()) renderAll(); });
  window.addEventListener('storage', e => { if (e.key === 'bloom_users' && load()) renderAll(); });
</script>
</body>
</html>
